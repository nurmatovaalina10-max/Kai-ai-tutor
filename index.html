ound:#253655;border-radius:9px}.progress .done{background:var(--accent2)}.progress .cur{background:var(--accent)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{padding:15px;background:#111c32;border:1px solid var(--line);border-radius:16px}.kpi strong{font-size:30px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}.curr{max-height:470px;overflow:auto}.currrow{display:grid;grid-template-columns:50px 1fr 52px;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)}.current{background:#1b2b4b;border-radius:10px}.tiny{font-size:12px;color:var(--muted)}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border-radius:13px;border:1px solid var(--line);background:#101b31;color:white}.choice:hover{border-color:#5571aa}.diagram{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#081120;border-radius:14px;padding:16px;white-space:pre-wrap;font-size:16px;line-height:1.6}.steps{counter-reset:s}.step{position:relative;padding:12px 12px 12px 44px;border:1px solid var(--line);border-radius:14px;margin:9px 0;background:#0f1a2f}.step:before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#243a67;color:#fff;font-weight:800}.footer{text-align:center;color:#64738f;font-size:11px;margin-top:25px}

"Богатство и выразительность русского языка","Лингвистика как наука о языке","Звуки и буквы. Правописание гласных и согласных в корнях слов","Буквы И, У, А после шипящих","Части речи","Глагол","Имя существительное","Имя прилагательное","Местоимение","Словосочетание. Предложение","Пунктуация","Язык и общение","Виды речи. Речь устная и письменная","Монолог","Прямая речь","Диалог. Полилог","Читаем по-разному","Слушание (аудирование)","Что мы знаем о тексте","Тема текста","Главная мысль (идея) текста","Абзац","Связь предложений в тексте","Повествование как функционально-смысловой тип речи","Рассказ как разновидность текста","Рассказ на основе услышанного","Описание как функционально-смысловой тип речи. Описание предмета","Рассуждение как функционально-смысловой тип речи","Доказательства в рассуждении","Функциональные разновидности языка. Разговорная речь. Язык художественной литературы","Функциональные стили: научный, официально-деловой, публицистический","Фонетика как раздел лингвистики","Гласные звуки","Согласные звуки","Изменение звуков в потоке речи","Согласные твёрдые и мягкие","Согласные звонкие и глухие","Графика","Алфавит","Обозначение мягкости согласных с помощью мягкого знака","Двойная роль букв Е, Ё, Ю, Я","Слог. Ударение. Орфоэпия","Фонетический анализ слова","Интонация, её функции","Орфография. Орфограмма","Раздельное написание предлогов с другими словами","Разделительные Ъ и Ь","Слово и его лексическое значение","Однозначные и многозначные слова","Прямое и переносное значения слов","Омонимы","Синонимы","Антонимы","Паронимы","Словари","Основные способы толкования слов","Лексический анализ слова","Морфема — минимальная значимая единица языка","Изменение и образование слов","Окончание","Основа слова","Корень слова","Суффикс","Приставка","Чередование звуков","Беглые гласные","Варианты морфем","Морфемный анализ слова","Правописание корней с безударными проверяемыми и непроверяемыми гласными","Правописание корней с проверяемыми и непроверяемыми согласными","Правописание корней с непроизносимыми согласными","Буквы Ё — О после шипящих в корне","Правописание гласных и согласных в приставках","Буквы З и С на конце приставок","Буквы Ы — И после Ц","Буквы Ы — И после приставок"];
var M=[

];
var THEORY={
equations:{title:"Уравнение — это равенство с неизвестным",points:["Главная цель — оставить неизвестное одно.","Используем обратные действия: сложению ↔ вычитание, умножению ↔ деление.","После решения обязательно подставляем найденное число и проверяем равенство."],example:"x + 18 = 43\nЧтобы оставить x один, убираем +18 обратным действием:\nx = 43 − 18 = 25\nПроверка: 25 + 18 = 43 ✓",visual:"x + 18  =  43\n   −18     −18\n──────────────\n   x      =  25"},
division:{title:"Деление столбиком — это работа по разрядам",points:["Двигаемся слева направо: сотни → десятки → единицы.","На каждом шаге: делим → умножаем → вычитаем → сносим следующую цифру.","Если текущая часть числа меньше делителя, в частном может появиться 0."],example:"816 : 4\n8 : 4 = 2. Пишем 2.\nСносим 1: 1 меньше 4 → в частном пишем 0.\nСносим 6: 16 : 4 = 4.\nОтвет: 204.",visual:"  816 │ 4\n -8   │ 204\n  01\n   0\n  16\n -16\n   0"},
geometry:{title:"Геометрические объекты отличаются количеством границ",points:["Отрезок имеет два конца.","Луч имеет начало, но не имеет конца в одном направлении.","Прямая не имеет ни начала, ни конца.","Названия читаем по точкам: отрезок AB, луч AB. Для луча порядок букв важен: A — начало."],example:"Если из точки A провести линию через B и продолжить дальше за B, получим луч AB.\nЕсли оставить только часть между A и B — отрезок AB.",visual:"отрезок AB:  A●────●B\nлуч AB:      A●────●B────→\nпрямая AB:   ←────●A────●B────→"},
logic:{title:"Сильная математика начинается с вопроса «что связано с чем?»",points:["Не спешим считать: сначала переводим условие в связи.","Полезно идти от результата назад — обратным ходом.","После ответа спрашиваем: подходит ли он ко всем условиям?"],example:"Задумали число, умножили на 4 и прибавили 3, получили 27.\nИдём назад: 27 − 3 = 24, затем 24 : 4 = 6.",visual:"?  → ×4 → +3 → 27\n6  ← ÷4 ← −3 ← 27"},
arithmetic:{title:"Вычислять можно не только правильно, но и удобно",points:["Разбивай числа на удобные части.","Используй свойства сложения и умножения.","Прикидка помогает заметить нелепый ответ."],example:"98 + 47 = (100 + 47) − 2 = 145.\nЭто быстрее и легче проверить, чем считать по цифрам без плана.",visual:"98 + 47\n= 100 + 47 − 2\n= 145"}
};
var RU_SPECIAL={
3:{k:"Орфограммы в корне",theory:["Сначала находим корень слова.","Гласную проверяем словом, где она под ударением; согласную — словом, где после неё слышится гласная.","Проверочное слово должно быть однокоренным или формой того же слова."],ex:"л…сной → лес; ду… → дубы."},
4:{k:"И, У, А после шипящих",theory:["ЖИ–ШИ пишем с И.","ЧА–ЩА пишем с А.","ЧУ–ЩУ пишем с У."],ex:"жизнь, машина, чаща, чудо, щука."},
5:{k:"Части речи",theory:["Часть речи определяем по значению, вопросу и грамматическим признакам.","Существительное называет предмет, прилагательное — признак, глагол — действие.","Важно уметь узнавать часть речи в предложении, а не только вспоминать определение."],ex:"Серый кот быстро бежит: кот — существительное, серый — прилагательное, бежит — глагол."},
6:{k:"Глагол",theory:["Глагол обозначает действие или состояние.","Отвечает на вопросы что делать? что сделать? что делает? что сделал?", "Начальная форма — неопределённая форма на -ть, -ти, -чь."],ex:"читать → читает → читал."},
7:{k:"Имя существительное",theory:["Существительное называет предмет в широком смысле.","Отвечает на вопросы кто? что?", "Имеет род, число и падеж."],ex:"кот, книга, Сахалин, радость."},
8:{k:"Имя прилагательное",theory:["Прилагательное обозначает признак предмета.","Связано с существительным и отвечает на какой? какая? какое? какие?", "Изменяется вместе с существительным."],ex:"синий лёд, синяя куртка, синее небо."},
9:{k:"Местоимение",theory:["Местоимение указывает на предмет или признак, но не называет его.","Личные местоимения: я, ты, он, она, оно, мы, вы, они.","В тексте местоимения помогают не повторять одно и то же слово."],ex:"Кай вышел на лёд. Он начал разминку."},
10:{k:"Словосочетание. Предложение",theory:["В словосочетании есть главное и зависимое слово: от главного задаём вопрос.","Грамматическая основа предложения не является словосочетанием.","Предложение выражает законченную мысль и имеет интонацию завершённости."],ex:"быстро едет — словосочетание; машина едет — грамматическая основа."},
11:{k:"Пунктуация",theory:["Знаки препинания показывают смысловое строение предложения.","Сначала определяем структуру предложения, потом ставим знак.","Запятую нельзя ставить только потому, что при чтении хочется сделать паузу."],ex:"Кай открыл дверь, вошёл в комнату и включил свет."},
45:{k:"Орфограмма",theory:["Орфограмма — место, где написание нужно выбрать по правилу.","Сначала находим опасное место, затем называем правило.","Только потом применяем проверку или алгоритм."],ex:"л…сной → безударная гласная в корне → лес → лесной."},
46:{k:"Предлог и приставка",theory:["Предлог — отдельное слово, приставка — часть слова.","Между предлогом и словом часто можно вставить другое слово.","Приставка пишется слитно с корнем."],ex:"в школе → в нашей школе; приехал → при- часть слова."},
47:{k:"Разделительные Ъ и Ь",theory:["Разделительные Ъ и Ь показывают раздельное произношение согласного и Е, Ё, Ю, Я.","Ъ обычно пишется после приставки на согласный.","Ь пишется внутри слова в других позициях по правилу."],ex:"подъезд, объявление; семья, вьюга."},
58:{k:"Морфема",theory:["Морфема — минимальная значимая часть слова.","Основные морфемы: корень, приставка, суффикс, окончание.","Чтобы не путаться, сначала ищем окончание и основу, потом корень и остальные части."],ex:"под-вод-н-ый: под- — приставка, -вод- — корень, -н- — суффикс, -ый — окончание."},
60:{k:"Окончание",theory:["Окончание — изменяемая часть слова, которая связывает слова в предложении.","Чтобы найти окончание, измени форму слова.","Часть, которая меняется, и есть окончание."],ex:"книга — книги — книге: меняется -а/-и/-е."},
61:{k:"Основа слова",theory:["Основа — часть слова без окончания.","Именно в основе заключено основное лексическое значение слова.","Сначала выделяем окончание, затем всё остальное — основа."],ex:"лесной: окончание -ой, основа лесн-."},
62:{k:"Корень",theory:["Корень — общая значимая часть родственных слов.","Однокоренные слова должны быть близки по смыслу.","Формы одного слова не считаются разными однокоренными словами."],ex:"лес, лесной, лесник — один корень -лес-."},
63:{k:"Суффикс",theory:["Суффикс стоит после корня и помогает образовывать новые слова.","Сравни родственные слова: часть, добавленная после корня, часто будет суффиксом."],ex:"лес → лесник: -ник- — суффикс."},
64:{k:"Приставка",theory:["Приставка стоит перед корнем и образует новые слова.","Не путай приставку с предлогом: приставка — часть слова, предлог — отдельное слово."],ex:"ехать → приехать → уехать → переехать."},
68:{k:"Морфемный анализ",theory:["Разбор выполняем в порядке: окончание → основа → корень → приставка → суффикс.","Каждую морфему нужно доказать изменением формы или подбором родственных слов."],ex:"подводный: под- / -вод- / -н- / -ый."},
69:{k:"Безударные гласные в корне",theory:["Если гласная в корне без ударения, сначала найди корень.","Подбери однокоренное слово или форму слова так, чтобы сомнительная гласная стала ударной.","Если проверить нельзя, слово нужно сверять со словарём и запоминать."],ex:"л…сной → лес → лесной. Проверочное слово делает Е ударной."},
70:{k:"Согласные в корне",theory:["Сомнительную согласную проверяем словом, где после неё стоит гласная или сонорный звук.","Важно сначала убедиться, что слова однокоренные."],ex:"дуб → дубы, мороз → морозы."},
71:{k:"Непроизносимые согласные",theory:["В некоторых сочетаниях один согласный плохо слышен, но пишется.","Нужно подобрать проверочное слово, где этот согласный произносится отчётливо."],ex:"сердце → сердечный; солнце → солнечный."},
72:{k:"Ё — О после шипящих в корне",theory:["В корне после ж, ш, ч, щ выбор ё/о часто проверяется формой или родственным словом.","Если есть чередование с Е, обычно пишем Ё."],ex:"шёпот — шепчет; жёлтый — желтеть."},
73:{k:"Гласные и согласные в приставках",theory:["Большинство приставок пишется одинаково независимо от произношения.","Сначала отдели приставку от корня и проверь, действительно ли это приставка."],ex:"подписать, надписать, отнести."},
74:{k:"З и С на конце приставок",theory:["Перед звонким согласным пишем З, перед глухим — С.","Смотрим на первый звук корня, а не на букву самой приставки."],ex:"безвкусный (в — звонкий), бесшумный (ш — глухой)."},
75:{k:"Ы — И после Ц",theory:["После Ц выбор Ы/И зависит от части слова и конкретного правила.","В корне чаще И: цирк, цифра; в окончаниях и суффиксах часто Ы: улицы, сестрицын."],ex:"цирк, цифра, но огурцы, сестрицын."},
76:{k:"Ы — И после приставок",theory:["После русской приставки на согласный начальное И корня часто меняется на Ы.","После меж- и сверх- И сохраняется."],ex:"играть → сыграть; искать → разыскать; интересный → сверхинтересный."}
};
var Q={
ruMorph:[

function ruBank(n){var sp=ruSpecific(n);if(sp)return sp;if(n<=11)return Q.ruBasics;if(n<=18)return Q.ruSpeech;if(n<=29)return Q.ruText;if(n<=31)return Q.ruStyles;if(n<=44)return Q.ruPhonetics;if(n<=47)return Q.ruOrthography;if(n<=57)return Q.ruLex;return Q.ruMorph}
function genRu(n,i){var bank=ruBank(n),z=bank[i%bank.length];return {q:z[0],a:z[1],h:z[2],t:"p"+n,b:55}}
function start(sub,topic,mode){
var control=mode==="control";
S.lesson={sub:sub,topic:topic||null,mode:mode||"lesson",phase:control?"practice":"theory",qs:[],i:0,hi:0,ans:[],start:Date.now(),fb:null};
if(sub==="m"){
  if(control){var topics=["equations","division","geometry","logic","arithmetic"];for(var i=0;i<10;i++)S.lesson.qs.push(genMath(topics[i%topics.length],i));}
  else{for(var j=0;j<6;j++)S.lesson.qs.push(genMath(topic,j));}
}else{
  var bank=ruBank(S.ru),count=control?Math.min(8,bank.length):Math.min(6,bank.length);
  for(var k=0;k<count;k++){var z=bank[k];S.lesson.qs.push({q:z[0],a:z[1],h:z[2],t:"p"+S.ru,b:55});}
}
S.screen="lesson";save();render()}
function guided(){var L=S.lesson,th=L.sub==="m"?THEORY[L.topic]:ruTheory(S.ru),q=L.qs[0];return shell('<div class="lesson"><div class="card"><span class="pill">Шаг 2 из 3 · пробуем вместе</span><h2>'+esc(th.title)+'</h2><div class="q">'+esc(q.q)+'</div><p class="muted">Сначала скажи себе: какое правило здесь нужно? Если застрял — открой одну подсказку.</p><input id="ans" class="answer" placeholder="Твой ответ"><div class="btns"><button class="primary" data-a="guidedCheck">Проверить</button><button class="secondary" data-a="hint">Подсказка</button></div>'+renderHints()+(L.fb?'<div class="feedback '+(L.fb.ok?'ok':'bad')+'">'+esc(L.fb.txt)+'</div>':'')+'</div></div>')}
function renderHints(){var L=S.lesson,q=L.qs[L.i],s="";for(var i=0;i<L.hi;i++)s+='<div class="hint"><b>Подсказка '+(i+1)+'</b><br>'+esc(q.h[i])+'</div>';return s}
function practice(){var L=S.lesson,q=L.qs[L.i],no=L.mode==="control",bars=L.qs.map(function(_,i){return '<i class="'+(i<L.i?'done':i===L.i?'cur':'')+'"></i>'}).join("");return shell('<div class="lesson"><button class="secondary" data-a="home">← На главную</button><div class="tiny">'+(L.sub==="m"?"Математика":"Русский язык")+(no?" · контрольная":" · самостоятельная практика")+'</div><div class="progress">'+bars+'</div><div class="card"><span class="pill">'+(no?"Контрольная":"Шаг 3 из 3 · самостоятельно")+'</span><div class="q">'+esc(q.q)+'</div><input id="ans" class="answer" autocomplete="off" placeholder="Твой ответ"><div class="btns"><button class="primary" data-a="check">Проверить</button>'+(no?"":'<button class="secondary" data-a="hint">Подсказка</button>')+'<button class="ghost" data-a="skip">Пропустить</button></div>'+(L.fb?'<div class="feedback '+(L.fb.ok?'ok':'bad')+'">'+esc(L.fb.txt)+'</div>':'')+renderHints()+'</div></div>')}
function lesson(){var L=S.lesson;if(L.phase==="theory")return theoryScreen();if(L.phase==="guided")return guided();return practice()}
function answer(ok){var L=S.lesson,q=L.qs[L.i];upd(L.sub,q.t,ok,L.hi,q.b);L.ans.push({ok:ok,h:L.hi});L.i++;L.hi=0;L.fb=null;if(L.i>=L.qs.length){var c=L.ans.filter(function(x){return x.ok}).length,h=L.ans.reduce(function(s,x){return s+x.h},0);S.sessions.unshift({d:new Date().toISOString(),s:L.sub,c:c,n:L.qs.length,h:h,topic:L.sub==='m'?L.topic:'§'+S.ru});S.screen="summary"}save();render()}
function summary(){var x=S.sessions[0]||{c:0,n:0,h:0};return shell('<div class="card"><span class="pill ok">Занятие завершено</span><h1>'+x.c+' из '+x.n+'</h1><p class="muted">Подсказок: '+x.h+'. Следующий урок будет учитывать самостоятельность, а не только число правильных ответов.</p><div class="btns"><button class="primary" data-a="home">На главную</button></div></div>')}
function parent(){var rows=S.sessions.slice(0,10).map(function(x){return '<tr><td>'+new Date(x.d).toLocaleDateString('ru-RU')+'</td><td>'+(x.s==='m'?'Математика':'Русский')+'</td><td>'+esc(x.topic||'')+'</td><td>'+x.c+'/'+x.n+'</td><td>'+x.h+'</td></tr>'}).join("")||'<tr><td colspan="5" class="tiny">Пока нет занятий.</td></tr>';var opts=RU.map(function(x,i){return '<option value="'+(i+1)+'" '+(S.ru===i+1?'selected':'')+'>§ '+(i+1)+'. '+esc(x)+'</option>'}).join("");return shell('<div class="card"><span class="pill">Родительский кабинет</span><h1>Прогресс Кая</h1><p class="muted">Главное изменение: учебный режим теперь отделён от контрольного. В обычном занятии сначала идёт объяснение.</p></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Текущий параграф русского</h3><select id="ruselect">'+opts+'</select><p class="muted">§ '+S.ru+'. '+esc(RU[S.ru-1])+'</p><button class="primary" data-a="startRuTheory">Открыть урок по этому §</button></div><div class="card"><h3>Математика</h3>'+M.map(topic).join("")+'</div></div><div class="card" style="margin-top:14px"><h3>Последние занятия</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Дата</th><th>Предмет</th><th>Тема</th><th>Результат</th><th>Подсказки</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>')}
function control(){return shell('<div class="card"><h2>Контрольная</h2><p class="muted">Контрольную лучше запускать после учебного занятия. Здесь нет теории и подсказок.</p><div class="grid2">'+M.map(function(x){return '<button class="choice" data-control="'+x.id+'"><b>'+esc(x.t)+'</b><br><span class="tiny">10 заданий</span></button>'}).join("")+'<button class="choice" data-a="cr"><b>Русский: § '+S.ru+'</b><br><span class="tiny">8 заданий</span></button></div><button class="ghost" data-a="home">Отмена</button></div>')}
function homework(){return ruMenu()}
function render(){var a=document.getElementById('app');if(S.role==='parent'&&S.screen==='home')a.innerHTML=parent();else if(S.screen==='mathMenu')a.innerHTML=mathMenu();else if(S.screen==='ruMenu')a.innerHTML=ruMenu();else if(S.screen==='lesson')a.innerHTML=lesson();else if(S.screen==='summary')a.innerHTML=summary();else if(S.screen==='control')a.innerHTML=control();else if(S.screen==='homework')a.innerHTML=homework();else a.innerHTML=home();bind()}
function bind(){document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){S.role=b.dataset.role;S.screen='home';S.lesson=null;save();render()}});document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){act(b.dataset.a)}});document.querySelectorAll('[data-mtopic]').forEach(function(b){b.onclick=function(){S.mathTopic=b.dataset.mtopic;start('m',S.mathTopic,'lesson')}});document.querySelectorAll('[data-control]').forEach(function(b){b.onclick=function(){start('m',b.dataset.control,'control')}});var rs=document.getElementById('ruselect');if(rs)rs.onchange=function(){S.ru=Number(rs.value);save();render()};var an=document.getElementById('ans');if(an)an.onkeydown=function(e){if(e.key==='Enter')act(S.lesson&&S.lesson.phase==='guided'?'guidedCheck':'check')}}
function act(a){if(a==='home'){S.screen='home';S.lesson=null;save();return render()}if(a==='mathMenu'){S.screen='mathMenu';save();return render()}if(a==='ruMenu'){S.screen='ruMenu';save();return render()}if(a==='startRuTheory')return start('r',null,'lesson');if(a==='weak'){var w=M.slice().sort(function(x,y){return mast('m',x.id,x.b)-mast('m',y.id,y.b)})[0];return start('m',w.id,'lesson')}if(a==='control'){S.screen='control';save();return render()}if(a==='cr')return start('r',null,'control');if(a==='homework'){S.screen='ruMenu';save();return render()}if(a==='progress'){S.role='parent';S.screen='home';save();return render()}if(a==='toGuided'){S.lesson.phase='guided';S.lesson.i=0;S.lesson.hi=0;S.lesson.fb=null;save();return render()}if(a==='hint'){var L=S.lesson,q=L.qs[L.i];L.hi=Math.min(q.h.length,L.hi+1);L.fb=null;save();return render()}if(a==='guidedCheck'){var Lg=S.lesson,qg=Lg.qs[0],vg=(document.getElementById('ans')||{}).value||'';if(!vg.trim())return;var okg=norm(vg)===norm(qg.a);if(okg){Lg.fb={ok:true,txt:'Верно. Теперь переходим к самостоятельным заданиям.'};save();render();setTimeout(function(){Lg.phase='practice';Lg.i=1;Lg.hi=0;Lg.fb=null;save();render()},650)}else{Lg.fb={ok:false,txt:'Не страшно. Открой подсказку и попробуй ещё раз — ответ пока не показываем.'};save();render()}return}if(a==='skip')return answer(false);if(a==='check'){var L=S.lesson,q=L.qs[L.i],v=(document.getElementById('ans')||{}).value||'';if(!v.trim())return;var ok=norm(v)===norm(q.a);if(ok){L.fb={ok:true,txt:'Верно. Объясни себе, почему это правило здесь сработало.'};save();render();setTimeout(function(){answer(true)},500)}else if(L.mode==='control'){L.fb={ok:false,txt:'Ответ сохранён. Разбор будет после контрольной.'};save();render();setTimeout(function(){answer(false)},500)}else{L.fb={ok:false,txt:'Пока не сходится. Проверь правило или возьми одну подсказку.'};save();render()}return}}
render();
})();
</script></body></html>
