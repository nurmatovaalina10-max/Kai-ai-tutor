    ruPhonetics: [
      {q:'Какой согласный в слове «день» — мягкий: [д] или [н’]?', a:'н', aliases:['н','н’','нʼ'], hints:['Посмотри на мягкий знак.','Ь смягчает предыдущий согласный.'], explain:'В слове «день» мягкий согласный [н’].'},
      {q:'Сколько слогов в слове «машина»?', a:'3', hints:['Сколько гласных — столько и слогов.','В слове гласные а, и, а.'], explain:'Три гласных — три слога: ма-ши-на.'}
    ],
    ruOrthography: [
      {q:'Как правильно: «в школе» или «вшколе»?', a:'в школе', hints:['«В» здесь предлог.','Предлоги с другими словами пишутся раздельно.'], explain:'Правильно: «в школе».'},
      {q:'Вставь знак: об__явление.', a:'ъ', aliases:['ъ','объявление'], hints:['После приставки на согласную перед я, е, ё, ю часто нужен разделительный знак.','Слово: об…явление.'], explain:'Правильно: объявление — разделительный Ъ.'}
    ],
    ruLexicology: [
      {q:'«Смелый» и «храбрый» — это синонимы или антонимы?', a:'синонимы', hints:['Их значения близки.','Антонимы имеют противоположные значения.'], explain:'Это синонимы.'},
      {q:'«Высокий» и «низкий» — это…', a:'антонимы', hints:['Значения противоположны.','Противоположные слова называются…'], explain:'Это антонимы.'},
      {q:'«Лук» (овощ) и «лук» (оружие) — это…', a:'омонимы', hints:['Звучат и пишутся одинаково, но значения разные.','Это не многозначность, а разные слова.'], explain:'Это омонимы.'}
    ],
    ruMorphemics: [
      {q:'В слове «подводный» общий с «вода, водный» корень — ?', a:'вод', aliases:['вод','-вод-'], hints:['Найди общую значимую часть родственных слов.','вода — водный — подводный.'], explain:'Корень: -вод-.'},
      {q:'В слове «подписать» приставка — ?', a:'под', aliases:['под','под-'], hints:['Приставка стоит перед корнем.','Сравни: писать — подписать.'], explain:'Приставка: под-.'},
      {q:'Подбери проверочное слово к «л_сной» (про лес). Напиши слово.', a:'лес', aliases:['лес','лесной'], hints:['Нужно, чтобы гласная в корне стала ударной.','Что такое место с деревьями?'], explain:'Проверочное слово: лес.'},
      {q:'Как правильно: «бе_шумный»: бесшумный или безшумный?', a:'бесшумный', aliases:['бесшумный','с'], hints:['Перед глухим согласным в приставках без-/бес- пишется С.','Ш — глухой согласный.'], explain:'Правильно: бесшумный.'}
    ]
  }
};

  </script>
  <script>
(() => {
  'use strict';
  const D = window.TUTOR_DATA;
  if (!D) throw new Error('TUTOR_DATA is missing');

  const APP_VERSION = '1.0.0-web';
  const STORAGE_KEY = 'kaiTutorStateWebV1';
  const defaultState = {
    role: 'child',
    screen: 'home',
    subject: 'math',
    currentRuParagraph: 3,
    profile: {name:'Кай', age:11, grade:5, sessionMinutes:40, sessionsPerWeek:3},
    progress: {},
    sessions: [],
    currentLesson: null,
    tutorMessages: [
      {from:'tutor', text:'Привет, Кай. Напиши, что непонятно. Я не дам готовый ответ сразу — сначала разберёмся вместе.'}
    ]
  };

  let state = loadState();

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function loadState(){
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return Object.assign(clone(defaultState), saved, {
        profile: Object.assign({}, defaultState.profile, saved.profile || {}),
        progress: saved.progress || {},
        sessions: saved.sessions || [],
        tutorMessages: saved.tutorMessages || clone(defaultState.tutorMessages)
      });
    } catch (e) {
      return clone(defaultState);
    }
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }
  function esc(s){ return String(s ?? '').replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }
  function norm(s){ return String(s || '').trim().toLowerCase().replace(/ё/g,'е').replace(/[.,!?;:"'()]/g,'').replace(/\s+/g,' '); }
  function isCorrect(q, answer){
    const a = norm(answer);
    return [q.a, ...(q.aliases || [])].map(norm).includes(a);
  }
  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function pick(arr,n){
    if(!arr.length) return [];
    const out=[];
    for(let i=0;i<n;i++) out.push(clone(arr[i % arr.length]));
    return out;
  }

  function topicKey(subject,id){ return `${subject}:${id}`; }
  function baselineForMath(id){ return D.mathTopics.find(t => t.id===id)?.baseline || 55; }
  function getProgress(subject,id,baseline){
    const key=topicKey(subject,id);
    if(!state.progress[key]) state.progress[key]={attempts:0,correct:0,hints:0,mastery:baseline ?? 55,last:null,errors:[]};
    return state.progress[key];
  }
  function mastery(subject,id){ return getProgress(subject,id,subject==='math'?baselineForMath(id):55).mastery; }
  function updateProgress(subject,id,ok,hints,errorLabel){
    const p=getProgress(subject,id,subject==='math'?baselineForMath(id):55);
    p.attempts += 1;
    if(ok) p.correct += 1;
    p.hints += hints;
    p.last = new Date().toISOString();
    const independence=Math.max(0,1-hints*0.28);
    p.mastery=Math.max(15,Math.min(98,Math.round(p.mastery + (ok ? 7*independence : -8))));
    if(!ok && errorLabel){ p.errors.unshift({label:errorLabel,date:p.last}); p.errors=p.errors.slice(0,8); }
    saveState();
  }
  function weakMath(){ return D.mathTopics.slice().sort((a,b)=>mastery('math',a.id)-mastery('math',b.id))[0].id; }
  function ruDomain(n){ if(n<=11)return'ruBasics';if(n<=18)return'ruSpeech';if(n<=29)return'ruText';if(n<=31)return'ruStyles';if(n<=44)return'ruPhonetics';if(n<=47)return'ruOrthography';if(n<=57)return'ruLexicology';return'ruMorphemics'; }
  function ruSection(n){ if(n<=11)return'Вспоминаем, повторяем, изучаем';if(n<=18)return'Язык и речь';if(n<=29)return'Текст';if(n<=31)return'Функциональные разновидности языка';if(n<=44)return'Фонетика. Графика. Орфоэпия';if(n<=47)return'Орфография';if(n<=57)return'Лексикология';return'Морфемика. Орфография'; }
  function russianTitle(n){ return D.russianCurriculum[n-1]?.[1] || 'Русский язык'; }

  function buildLesson(subject,mode='lesson'){
    if(subject==='math'){
      if(mode==='control'){
        const pool=[];
        D.mathTopics.forEach(t => (D.questions[t.id] || []).forEach(q => pool.push({...q,topic:t.id})));
        return shuffle(pool).slice(0,10);
      }
      const topic=weakMath();
      return pick(shuffle(D.questions[topic] || []),6).map(q=>({...q,topic}));
    }
    const n=state.currentRuParagraph;
    const domain=ruDomain(n);
    if(mode==='control'){
      const domains=['ruBasics','ruSpeech','ruText','ruStyles','ruPhonetics','ruOrthography','ruLexicology','ruMorphemics'];
      const pool=[];
      domains.forEach(d => (D.questions[d] || []).forEach(q => pool.push({...q,topic:d})));
      return shuffle(pool).slice(0,10);
    }
    return pick(shuffle(D.questions[domain] || []),6).map(q=>({...q,topic:domain}));
  }

  function startLesson(subject,mode='lesson'){
    const qs=buildLesson(subject,mode);
    state.subject=subject;
    state.currentLesson={subject,mode,qs,index:0,hintIndex:0,answers:[],started:Date.now(),feedback:null};
    state.screen='lesson';
    saveState(); render();
  }
  function finishLesson(){
    const L=state.currentLesson;
    const correct=L.answers.filter(x=>x.ok).length;
    const hints=L.answers.reduce((s,x)=>s+x.hints,0);
    const minutes=Math.max(1,Math.round((Date.now()-L.started)/60000));
    state.sessions.unshift({
      date:new Date().toISOString(), subject:L.subject, mode:L.mode,
      correct,total:L.qs.length,hints,minutes,
      paragraph:L.subject==='ru'?state.currentRuParagraph:null
    });
    state.sessions=state.sessions.slice(0,60);
    state.screen='summary';
    saveState(); render();
  }

  function shell(content){
    return `<div class="shell">
      <header class="topbar">
        <button class="brand brand-button" data-action="home" aria-label="На главную">Мой <span>ИИ-репетитор</span></button>
        <div class="role-switch" aria-label="Режим интерфейса">
          <button class="${state.role==='child'?'active':''}" data-role="child">Кай</button>
          <button class="${state.role==='parent'?'active':''}" data-role="parent">Родитель</button>
        </div>
      </header>
      ${content}
      <footer class="site-footer">Версия ${APP_VERSION} · прогресс хранится на этом устройстве</footer>
    </div>`;
  }
  function topicCard(title,pct,note){
    return `<div class="topic"><div class="topic-head"><div><h3>${esc(title)}</h3><div class="tiny">${esc(note)}</div></div><b>${pct}%</b></div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
  }

  function childHome(){
    const weak=weakMath();
    const weakTopic=D.mathTopics.find(t=>t.id===weak);
    const currentRuMastery=mastery('ru',ruDomain(state.currentRuParagraph));
    return shell(`
      <section class="hero">
        <div class="card hero-main">
          <span class="pill">5 класс · персональный маршрут</span>
          <h1>Привет, ${esc(state.profile.name)}.</h1>
          <p class="sub">Сегодня — короткие шаги, схемы и задачи. Никаких длинных лекций: сначала думаем, потом формулируем правило.</p>
          <div class="btnrow">
            <button class="primary big" data-action="start-math">Начать занятие</button>
            <button class="secondary" data-action="start-ru">Русский по учебнику</button>
          </div>
        </div>
        <div class="card focus-card">
          <div class="eyebrow">Фокус сегодня</div>
          <div class="focus-title">${esc(weakTopic.title)}</div>
          <p class="sub">${esc(weakTopic.note)}</p>
          <div class="chiprow"><span class="tag">~40 минут</span><span class="tag">короткие шаги</span></div>
        </div>
      </section>

      <section class="navcards">
        <button class="navcard" data-action="weak"><span class="navicon">↺</span><b>Повторить слабое</b><small>Задания на те места, где раньше были ошибки.</small></button>
        <button class="navcard" data-action="choose-control"><span class="navicon">✓</span><b>Контрольная</b><small>Без подсказок. Разбор после окончания.</small></button>
        <button class="navcard" data-action="homework"><span class="navicon">▣</span><b>Разобрать домашку</b><small>Фото задания и похожие тренировочные примеры.</small></button>
        <button class="navcard" data-action="tutor"><span class="navicon">?</span><b>Спросить репетитора</b><small>Короткое объяснение без готового ответа.</small></button>
        <button class="navcard" data-action="progress"><span class="navicon">↗</span><b>Мой прогресс</b><small>Темы, уровни и самостоятельность.</small></button>
      </section>

      <section class="grid2">
        <div class="card stack"><div class="section-title">Математика</div>${D.mathTopics.map(t=>topicCard(t.title,mastery('math',t.id),t.note)).join('')}</div>
        <div class="card">
          <div class="section-title">Русский язык</div>
          <div class="topic current-topic"><div class="topic-head"><div><h3>Сейчас в школе</h3><div class="tiny">§ ${state.currentRuParagraph}. ${esc(russianTitle(state.currentRuParagraph))}</div></div><b>${currentRuMastery}%</b></div><div class="bar"><span style="width:${currentRuMastery}%"></span></div></div>
          <div class="mission"><b>Как работает репетитор</b><p class="sub compact">Ошибка → вопрос → подсказка → ещё одна подсказка → разбор. Готовый ответ не появляется после первой ошибки.</p></div>
        </div>
      </section>`);
  }

  function lessonView(){
    const L=state.currentLesson;
    if(!L || !L.qs.length) return shell(`<div class="card">Для этой темы пока нет тестовых заданий. <button class="secondary" data-action="home">На главную</button></div>`);
    const q=L.qs[L.index];
    const noHints=L.mode==='control';
    const title=L.subject==='math' ? (D.mathTopics.find(t=>t.id===q.topic)?.title || 'Математика') : `§ ${state.currentRuParagraph}. ${russianTitle(state.currentRuParagraph)}`;
    return shell(`
      <main class="lesson-wrap">
        <div class="screen-title"><button class="back" data-action="home">←</button><div><div class="eyebrow">${L.subject==='math'?'Математика':'Русский язык'} · ${L.mode==='control'?'контрольная':'занятие'}</div><h2>${esc(title)}</h2></div></div>
        <div class="lesson-progress">${L.qs.map((_,i)=>`<span class="${i<L.index?'done':i===L.index?'current':''}"></span>`).join('')}</div>
        <section class="card lesson-card">
          <span class="pill">Задание ${L.index+1} из ${L.qs.length}</span>
          <div class="question">${esc(q.q)}</div>
          <label class="answer-label" for="answer">Твой ответ</label>
          <input id="answer" class="answer" autocomplete="off" autocapitalize="sentences" />
          ${L.feedback?`<div class="feedback ${L.feedback.ok?'ok':'bad'}">${esc(L.feedback.text)}</div>`:''}
          ${L.hintIndex>0 && !noHints?`<div class="hintbox"><b>Подсказка ${L.hintIndex}</b><div>${esc(q.hints[Math.min(L.hintIndex-1,q.hints.length-1)])}</div></div>`:''}
          <div class="btnrow"><button class="primary" data-action="check">Проверить</button>${!noHints?`<button class="secondary" data-action="hint">Подсказка</button>`:''}<button class="ghost" data-action="skip">Пропустить</button></div>
        </section>
        <div class="footer-note">Подсказки учитываются отдельно: правильный ответ с подсказкой и полностью самостоятельное решение — не одно и то же.</div>
      </main>`);
  }

  function summaryView(){
    const s=state.sessions[0];
    const pct=Math.round(100*s.correct/s.total);
    const independent=Math.max(0,100-Math.min(100,Math.round((s.hints/Math.max(1,s.total))*28)));
    const message=pct>=80?'Материал в целом понятен. Следующее занятие можно немного усложнить.':pct>=60?'Основа есть, но часть навыков надо закрепить.':'Лучше вернуться на шаг назад и объяснить тему другим способом.';
    return shell(`<main class="lesson-wrap"><section class="card result-card"><span class="pill">Занятие завершено</span><h1>${s.correct} из ${s.total}</h1><p class="sub">${message}</p><div class="kpi-grid"><div class="kpi"><div class="metric">${pct}%</div><div class="metric-label">точность</div></div><div class="kpi"><div class="metric">${s.hints}</div><div class="metric-label">подсказок</div></div><div class="kpi"><div class="metric">${independent}%</div><div class="metric-label">самостоятельность</div></div><div class="kpi"><div class="metric">${s.minutes}</div><div class="metric-label">минут</div></div></div><div class="btnrow"><button class="primary" data-action="home">На главную</button><button class="secondary" data-action="weak">Повторить слабое</button></div></section></main>`);
  }

  function progressView(){
    return shell(`<div class="screen-title"><button class="back" data-action="home">←</button><h2>Мой прогресс</h2></div><div class="grid2"><section class="card stack"><div class="section-title">Математика</div>${D.mathTopics.map(t=>topicCard(t.title,mastery('math',t.id),t.note)).join('')}</section><section class="card stack"><div class="section-title">Русский язык</div>${['ruBasics','ruSpeech','ruText','ruStyles','ruPhonetics','ruOrthography','ruLexicology','ruMorphemics'].map((d,i)=>topicCard(['Повторение','Язык и речь','Текст','Стили','Фонетика','Орфография','Лексикология','Морфемика'][i],mastery('ru',d),'По части 1 школьного учебника')).join('')}</section></div>`);
  }

  function homeworkView(){
    return shell(`<div class="screen-title"><button class="back" data-action="home">←</button><h2>Разобрать домашку</h2></div><div class="grid2"><section class="card"><div class="section-title">Русский язык</div><label class="field-label" for="ru-paragraph">Текущий параграф</label><select id="ru-paragraph" class="select">${D.russianCurriculum.map(([n,t])=>`<option value="${n}" ${n===state.currentRuParagraph?'selected':''}>§ ${n}. ${esc(t)}</option>`).join('')}</select><div class="recommend"><b>${esc(ruSection(state.currentRuParagraph))}</b><br><span class="tiny">Репетитор даст несколько похожих примеров и только потом вернётся к домашнему заданию.</span></div><div class="btnrow"><button class="primary" data-action="start-ru">Потренироваться по §</button></div></section><section class="card"><div class="section-title">Фото задания</div><label class="upload" for="hwfile"><span class="upload-icon">＋</span><b>Выбрать или сфотографировать</b><span class="tiny">В этой версии фото можно прикрепить и посмотреть. Автоматическое распознавание подключается вместе с серверным ИИ.</span></label><input id="hwfile" class="hidden-file" type="file" accept="image/*" capture="environment"/><div id="preview" class="preview"></div></section></div>`);
  }

  function controlChooser(){
    return shell(`<main class="lesson-wrap"><div class="screen-title"><button class="back" data-action="home">←</button><h2>Контрольная</h2></div><section class="card"><p class="sub">10 заданий, подсказки отключены. Ошибки разбираются только после окончания.</p><div class="choice-grid"><button class="choice" data-action="control-math"><b>Математика</b><span>Уравнения, деление, геометрия, логика</span></button><button class="choice" data-action="control-ru"><b>Русский язык</b><span>Темы по части 1 учебника</span></button></div></section></main>`);
  }

  function tutorView(){
    const msgs=state.tutorMessages.slice(-16).map(m=>`<div class="bubble ${m.from==='user'?'user':'tutor'}">${esc(m.text)}</div>`).join('');
    return shell(`<main class="lesson-wrap"><div class="screen-title"><button class="back" data-action="home">←</button><div><div class="eyebrow">Демо-помощник</div><h2>Спросить репетитора</h2></div></div><section class="card chat-card"><div class="chat" id="chat">${msgs}</div><div class="chat-compose"><input id="tutor-input" class="answer" placeholder="Например: не понимаю, почему в уравнении надо вычитать 18"/><button class="primary" data-action="send-tutor">Отправить</button></div><div class="footer-note">Сейчас это локальный демонстрационный помощник. Настоящий ИИ-диалог будет подключён на сервере, чтобы не хранить секретный API-ключ в браузере.</div></section></main>`);
  }

  function parentHome(){
    const recent=state.sessions.slice(0,6);
    const totalMinutes=state.sessions.reduce((s,x)=>s+x.minutes,0);
    const recentHints=recent.reduce((s,x)=>s+x.hints,0);
    const recentTasks=recent.reduce((s,x)=>s+x.total,0);
    const weak=weakMath();
    const weakTopic=D.mathTopics.find(t=>t.id===weak);
    const recentRows=recent.length?recent.map(s=>`<tr><td>${new Date(s.date).toLocaleDateString('ru-RU')}</td><td>${s.subject==='math'?'Математика':'Русский'}</td><td>${s.correct}/${s.total}</td><td>${s.hints}</td></tr>`).join(''):`<tr><td colspan="4" class="tiny">Пока нет завершённых занятий.</td></tr>`;
    return shell(`
      <section class="hero parent-hero"><div class="card"><span class="pill">Родительский кабинет</span><h1>Видно не только оценку, но и причину ошибки.</h1><p class="sub">Отдельно отслеживаются самостоятельность, подсказки, слабые навыки и школьный параграф.</p></div><div class="card"><div class="eyebrow">Рекомендация</div><div class="focus-title">${esc(weakTopic.title)}</div><p class="sub">На следующем занятии 7–10 минут на этот навык + русский по текущему параграфу.</p></div></section>
      <section class="kpi-grid"><div class="kpi"><div class="metric">${state.sessions.length}</div><div class="metric-label">занятий</div></div><div class="kpi"><div class="metric">${totalMinutes}</div><div class="metric-label">минут</div></div><div class="kpi"><div class="metric">${recentTasks}</div><div class="metric-label">недавних заданий</div></div><div class="kpi"><div class="metric">${recentHints}</div><div class="metric-label">подсказок</div></div></section>
      <section class="grid2 section-gap"><div class="card stack"><div class="section-title">Математика</div>${D.mathTopics.map(t=>topicCard(t.title,mastery('math',t.id),t.note)).join('')}</div><div class="card"><div class="section-title">Русский · школьная программа</div><label class="field-label" for="parent-ru">Текущий параграф</label><select id="parent-ru" class="select">${D.russianCurriculum.map(([n,t])=>`<option value="${n}" ${n===state.currentRuParagraph?'selected':''}>§ ${n}. ${esc(t)}</option>`).join('')}</select><div class="recommend"><b>Сейчас:</b> § ${state.currentRuParagraph}. ${esc(russianTitle(state.currentRuParagraph))}<br><span class="tiny">Раздел: ${esc(ruSection(state.currentRuParagraph))}</span></div></div></section>
      <section class="card section-gap"><div class="section-title">Последние занятия</div><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Предмет</th><th>Результат</th><th>Подсказки</th></tr></thead><tbody>${recentRows}</tbody></table></div></section>
      <section class="card section-gap"><div class="section-title">Русский язык · часть 1</div><div class="curriculum">${D.russianCurriculum.map(([n,t])=>{const m=mastery('ru',ruDomain(n)); return `<div class="curriculum-row ${n===state.currentRuParagraph?'current':''}"><div><span class="statusdot ${m>=75?'good':m>=55?'mid':''}"></span>§ ${n}</div><div>${esc(t)}</div><div>${m}%</div></div>`}).join('')}</div></section>
      <section class="card section-gap"><div class="section-title">Данные</div><div class="btnrow"><button class="secondary" data-action="export">Экспорт прогресса</button><button class="ghost danger-text" data-action="reset">Сбросить данные</button></div></section>`);
  }

  function tutorReply(text){
    const n=norm(text);
    if(/уравнен|x|икс/.test(n)) return 'Покажи само уравнение. Сначала определим, какое действие сделали с неизвестным. Потом подберём обратное действие — без «переноса через равно».';
    if(/делен|столб/.test(n)) return 'Разберём по одному разряду. Напиши пример. Я буду задавать по одному вопросу: сколько раз делитель помещается в первой части делимого, что записываем в частное и что сносим дальше.';
    if(/луч|отрез|прям/.test(n)) return 'Смотри на количество границ: у отрезка два конца, у луча одно начало, у прямой нет ни начала, ни конца. Напиши, что именно путается — название или построение?';
    if(/корен|пристав|суффикс|морфем/.test(n)) return 'Возьмём слово и сравним его с родственными словами. Так легче увидеть общую часть и отделить приставку или суффикс. Напиши слово.';
    if(/правил|русск|параграф|§/.test(n)) return `Сейчас выбран § ${state.currentRuParagraph}: «${russianTitle(state.currentRuParagraph)}». Напиши, что именно в нём непонятно, и я объясню коротко на одном примере.`;
    return 'Давай разберём по шагам. Напиши конкретный пример или одно предложение из задания. Я сначала задам вопрос, который поможет самому увидеть следующий шаг.';
  }

  function render(){
    const app=document.getElementById('app');
    if(!app) return;
    let html='';
    if(state.screen==='lesson') html=lessonView();
    else if(state.screen==='summary') html=summaryView();
    else if(state.screen==='progress') html=progressView();
    else if(state.screen==='homework') html=homeworkView();
    else if(state.screen==='control') html=controlChooser();
    else if(state.screen==='tutor') html=tutorView();
    else html=state.role==='parent'?parentHome():childHome();
    app.innerHTML=html;
    bind();
  }

  function bind(){
    document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',()=>{state.role=el.dataset.role;state.screen='home';state.currentLesson=null;saveState();render();}));
    document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));
    const ru=document.getElementById('ru-paragraph');
    if(ru) ru.addEventListener('change',()=>{state.currentRuParagraph=Number(ru.value);saveState();render();});
    const pru=document.getElementById('parent-ru');
    if(pru) pru.addEventListener('change',()=>{state.currentRuParagraph=Number(pru.value);saveState();render();});
    const file=document.getElementById('hwfile');
    if(file) file.addEventListener('change',e=>{
      const f=e.target.files?.[0]; if(!f) return;
      const url=URL.createObjectURL(f);
      const preview=document.getElementById('preview');
      if(preview) preview.innerHTML=`<img src="${url}" alt="Фото домашнего задания" class="preview-image">`;
    });
    const ans=document.getElementById('answer');
    if(ans) ans.addEventListener('keydown',e=>{if(e.key==='Enter')act('check');});
    const tutorInput=document.getElementById('tutor-input');
    if(tutorInput) tutorInput.addEventListener('keydown',e=>{if(e.key==='Enter')act('send-tutor');});
    const chat=document.getElementById('chat');
    if(chat) chat.scrollTop=chat.scrollHeight;
  }

  function act(action){
    if(action==='home'){state.screen='home';state.currentLesson=null;saveState();return render();}
    if(action==='start-math') return startLesson('math','lesson');
    if(action==='start-ru') return startLesson('ru','lesson');
    if(action==='weak') return startLesson('math','weak');
    if(action==='choose-control'){state.screen='control';saveState();return render();}
    if(action==='control-math') return startLesson('math','control');
    if(action==='control-ru') return startLesson('ru','control');
    if(action==='homework'){state.screen='homework';saveState();return render();}
    if(action==='progress'){state.screen='progress';saveState();return render();}
    if(action==='tutor'){state.screen='tutor';saveState();return render();}
    if(action==='hint'){
      const L=state.currentLesson, q=L.qs[L.index];
      L.hintIndex=Math.min(q.hints.length,L.hintIndex+1); L.feedback=null; saveState(); return render();
    }
    if(action==='skip') return recordAnswer(false,true,'');
    if(action==='check'){
      const input=document.getElementById('answer');
      const answer=input?.value || '';
      if(!answer.trim()){ input?.focus(); return; }
      const L=state.currentLesson, q=L.qs[L.index], ok=isCorrect(q,answer);
      if(ok){
        L.feedback={ok:true,text:'Верно. Хорошо. Теперь запомни не ответ, а способ.'}; saveState(); render(); setTimeout(()=>recordAnswer(true,false,answer),550);
      } else if(L.mode==='control'){
        L.feedback={ok:false,text:'Ответ сохранён. Разберём после контрольной.'}; saveState(); render(); setTimeout(()=>recordAnswer(false,false,answer),550);
      } else {
        L.feedback={ok:false,text:'Пока не сходится. Не спешим: возьми подсказку и попробуй ещё раз.'}; saveState(); render();
      }
      return;
    }
    if(action==='send-tutor'){
      const input=document.getElementById('tutor-input');
      const text=input?.value.trim(); if(!text) return;
      state.tutorMessages.push({from:'user',text});
      state.tutorMessages.push({from:'tutor',text:tutorReply(text)});
      state.tutorMessages=state.tutorMessages.slice(-20); saveState(); render(); return;
    }
    if(action==='export'){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='kai-tutor-progress.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); return;
    }
    if(action==='reset'){
      if(confirm('Сбросить весь сохранённый прогресс на этом устройстве?')){ try{localStorage.removeItem(STORAGE_KEY);}catch(e){} state=clone(defaultState); render(); }
    }
  }

  function recordAnswer(ok,skipped=false,answer=''){
    const L=state.currentLesson;
    if(!L || !L.qs[L.index]) return;
    const q=L.qs[L.index];
    updateProgress(L.subject==='math'?'math':'ru',q.topic,ok,L.hintIndex,!ok?`Ошибка: ${q.q}`:null);
    L.answers.push({ok,hints:L.hintIndex,answer,skipped});
    L.index += 1; L.hintIndex=0; L.feedback=null;
    if(L.index>=L.qs.length) return finishLesson();
    saveState(); render();
  }

  render();
})();

  </script>
</body>
</html>
